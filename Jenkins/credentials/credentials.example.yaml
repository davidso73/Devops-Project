# EXAMPLE ONLY - shows the shape of Jenkins Credentials-as-Code needed for
# this project. Never fill in real values here and commit them. The real
# file (with real values) is applied out-of-band and is itself gitignored -
# see README "Credentials and secrets -> how to create the real credential."
#
# Only the GitHub webhook shared secret is actually needed as a Jenkins
# credential in this design: the repo is public (no clone credential
# needed), ECR auth is via IRSA (no registry password), and cluster auth is
# via the CD ServiceAccount's own token (no kubeconfig). This short list is
# itself a direct consequence of the least-privilege design, not something
# trimmed down separately.
credentials:
  system:
    domainCredentials:
      - credentials:
          - string:
              scope: GLOBAL
              id: "github-webhook-secret"
              description: "Shared secret GitHub signs webhook payloads with - validated by the github plugin, never logged."
              secret: "CHANGEME-generate-a-random-value-store-it-only-in-the-real-untracked-file"
