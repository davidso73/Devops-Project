# EXAMPLE ONLY - the Kubernetes Secret holding Jenkins' own bootstrap admin
# credentials (consumed by jcasc/jenkins.yaml as JENKINS_ADMIN_USER /
# JENKINS_ADMIN_PASSWORD env vars) and the GitHub webhook shared secret.
# Kept OUTSIDE any templates/ directory so it's never accidentally applied -
# same pattern as K8s/helm/my-app/secret.example.yaml. See README "How to
# create the real secret" for the actual command.
apiVersion: v1
kind: Secret
metadata:
  name: jenkins-admin-secret
  namespace: jenkins
type: Opaque
stringData:
  JENKINS_ADMIN_USER: "CHANGEME"
  JENKINS_ADMIN_PASSWORD: "CHANGEME-use-a-long-random-value"
  GITHUB_WEBHOOK_SECRET: "CHANGEME-use-a-long-random-value"
