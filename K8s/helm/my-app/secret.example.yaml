# EXAMPLE ONLY - shows the shape of the Secret the app expects. Never edit
# this file to contain real values and commit them.
#
# Deliberately kept OUTSIDE templates/ (Helm renders and applies everything
# under templates/, so a real-looking Secret manifest there would actually
# get created on `helm install` with these literal placeholder strings).
# The real Secret is created out-of-band via `kubectl create secret` - see
# README "Secrets Management" for the exact command.
apiVersion: v1
kind: Secret
metadata:
  name: vmapp-secrets
  namespace: devops-app
type: Opaque
stringData:
  DB_PASSWORD: "CHANGEME-fetch-with-terraform-output--raw-db_password"
  FLASK_SECRET_KEY: "CHANGEME-fetch-with-terraform-output--raw-flask_secret_key"
