# Non-secret configuration only - DB password and Flask session key live in
# a Secret instead (templates/secret.example.yaml + README "Secrets Management").
apiVersion: v1
kind: ConfigMap
metadata:
  name: vmapp-config
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "vmapp.labels" . | nindent 4 }}
data:
  AWS_REGION: {{ .Values.config.awsRegion | quote }}
  S3_BUCKET: {{ .Values.config.s3Bucket | quote }}
  SQS_QUEUE_URL: {{ .Values.config.sqsQueueUrl | quote }}
  SNS_TOPIC_ARN: {{ .Values.config.snsTopicArn | quote }}
  DB_HOST: {{ .Values.config.dbHost | quote }}
  DB_NAME: {{ .Values.config.dbName | quote }}
  DB_USER: {{ .Values.config.dbUser | quote }}
  nginx.conf: |
    server {
        listen 8080;
        server_name _;

        location / {
            proxy_pass http://vmapp-backend.{{ .Values.namespace }}.svc.cluster.local:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
