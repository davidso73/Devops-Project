# Enforced by the VPC CNI's native NetworkPolicy support (enabled on the
# EKS cluster - see K8s/terraform/eks.tf, aws_eks_addon.vpc_cni). Answers the
# README's "who can talk to whom" question with actual enforcement, not just
# a diagram.

# 1. Default deny all ingress in the namespace - nothing is reachable unless
#    explicitly allowed below. This alone is what makes the worker
#    unreachable: it gets no matching allow-ingress policy at all.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: {{ .Values.namespace }}
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
---
# 2. Frontend: reachable from the ALB (arrives as a VPC IP, not a pod), so
#    allowed from the whole VPC CIDR rather than a pod selector.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-frontend
  namespace: {{ .Values.namespace }}
spec:
  podSelector:
    matchLabels:
      {{- include "vmapp.selectorLabels" "frontend" | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - ipBlock: { cidr: 10.0.0.0/16 }
      ports:
        - { protocol: TCP, port: 8080 }
---
# 3. Backend: reachable ONLY from frontend pods - not from the internet, not
#    from worker, not from anything else in the namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-backend-from-frontend
  namespace: {{ .Values.namespace }}
spec:
  podSelector:
    matchLabels:
      {{- include "vmapp.selectorLabels" "backend" | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "vmapp.selectorLabels" "frontend" | nindent 14 }}
      ports:
        - { protocol: TCP, port: 8000 }
---
# 4. Egress for backend/worker: DNS, RDS (anywhere in the VPC on 5432), and
#    HTTPS (AWS APIs - S3/SQS/SNS/STS have no fixed IPs, so this stays broad).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-backend-worker
  namespace: {{ .Values.namespace }}
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: ["vmapp-backend", "vmapp-worker"]
  policyTypes: ["Egress"]
  egress:
    - to: [{ ipBlock: { cidr: 10.0.0.0/16 } }]
      ports: [{ protocol: TCP, port: 5432 }]
    - to: [{ ipBlock: { cidr: 0.0.0.0/0 } }]
      ports: [{ protocol: TCP, port: 443 }]
    - ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
---
# 5. Egress for frontend: DNS + talk to the backend Service.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-frontend
  namespace: {{ .Values.namespace }}
spec:
  podSelector:
    matchLabels:
      {{- include "vmapp.selectorLabels" "frontend" | nindent 6 }}
  policyTypes: ["Egress"]
  egress:
    - to:
        - podSelector:
            matchLabels:
              {{- include "vmapp.selectorLabels" "backend" | nindent 14 }}
      ports: [{ protocol: TCP, port: 8000 }]
    - ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
