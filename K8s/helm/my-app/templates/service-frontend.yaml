# ClusterIP - the ALB (via Ingress) targets this Service's pod IPs directly
# (target-type: ip). Not itself internet-facing; only the ALB is.
apiVersion: v1
kind: Service
metadata:
  name: vmapp-frontend
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "vmapp.selectorLabels" "frontend" | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "vmapp.selectorLabels" "frontend" | nindent 4 }}
  ports:
    - port: 80
      targetPort: 8080
