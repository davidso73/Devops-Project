# Three separate ServiceAccounts, one per service - each carries only the
# AWS permissions that specific service needs (or none, for frontend).
# See README "Kubernetes Security" -> ServiceAccounts / privilege separation.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccounts.frontend.name }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "vmapp.selectorLabels" "frontend" | nindent 4 }}
# No IRSA annotation: the frontend never calls an AWS API, so it gets no IAM role at all.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccounts.backend.name }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "vmapp.selectorLabels" "backend" | nindent 4 }}
  annotations:
    eks.amazonaws.com/role-arn: {{ .Values.serviceAccounts.backend.irsaRoleArn }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccounts.worker.name }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "vmapp.selectorLabels" "worker" | nindent 4 }}
  annotations:
    eks.amazonaws.com/role-arn: {{ .Values.serviceAccounts.worker.irsaRoleArn }}
