# ClusterIP, internal only - not referenced by the Ingress, so the ALB never
# gets a route to it. Only frontend pods can reach it (see networkpolicy.yaml
# for the enforced restriction, not just a naming convention).
apiVersion: v1
kind: Service
metadata:
  name: vmapp-backend
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "vmapp.selectorLabels" "backend" | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "vmapp.selectorLabels" "backend" | nindent 4 }}
  ports:
    - port: 8000
      targetPort: 8000
